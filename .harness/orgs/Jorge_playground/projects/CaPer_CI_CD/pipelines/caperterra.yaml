pipeline:
  name: caperterra
  identifier: caperterra
  projectIdentifier: CaPer_CI_CD
  orgIdentifier: Jorge_playground
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: jigg_terrainfra
        build: <+input>
  stages:
    - stage:
        name: terraform_plan_apply
        identifier: terraform_plan_apply
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: GitClone
                  name: GitClone_1
                  identifier: GitClone_1
                  spec:
                    connectorRef: jigg_terrainfra
                    build:
                      type: branch
                      spec:
                        branch: main
    - stage:
        name: terraapprove
        identifier: terraapprove
        description: ""
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: caper_service
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: <+input>
                      sources: <+input>
          environment:
            environmentRef: caperdev
            deployToAll: false
            infrastructureDefinitions:
              - identifier: caperdevcluster
          execution:
            steps:
              - step:
                  name: Rollout Deployment
                  identifier: rolloutDeployment
                  type: K8sRollingDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
              - step:
                  type: TerraformPlan
                  name: TerraformPlan
                  identifier: TerraformPlan
                  spec:
                    provisionerIdentifier: terraformplan
                    configuration:
                      command: Apply
                      configFiles:
                        store:
                          spec:
                            connectorRef: jigg_terrainfra
                            gitFetchType: Branch
                            branch: main
                            folderPath: .
                          type: Github
                      secretManagerRef: harnessSecretManager
                      skipRefreshCommand: false
                  timeout: 10m
              - step:
                  type: HarnessApproval
                  name: approveInfra
                  identifier: approveInfra
                  spec:
                    approvalMessage: "\"Aprobar la aplicación del plan de Terraform en el entorno dev\""
                    includePipelineExecutionHistory: true
                    isAutoRejectEnabled: false
                    approvers:
                      userGroups:
                        - _project_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false
                      serviceAccounts:
                        - jiggcaper
                    approverInputs: []
                  timeout: 10m
              - step:
                  type: TerraformApply
                  name: TerraformApply
                  identifier: TerraformApply
                  spec:
                    provisionerIdentifier: terraformplan
                    configuration:
                      type: InheritFromPlan
                  timeout: 10m
            rollbackSteps:
              - step:
                  name: Rollback Rollout Deployment
                  identifier: rollbackRolloutDeployment
                  type: K8sRollingRollback
                  timeout: 10m
                  spec:
                    pruningEnabled: false
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
